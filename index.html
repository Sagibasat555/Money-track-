<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>בניין והפעלת הכוח</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --pro: #38bdf8;
      --fat: #f59e0b;
      --carb: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
    header { background: #111827; padding: 16px; text-align: center; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.1rem; color: var(--accent); }

    .card { background: var(--card); border-radius: 12px; padding: 16px; margin: 16px; border: 1px solid #334155; }
    .balance-box { text-align: center; }
    .balance-box .amount { font-size: 2.2rem; font-weight: bold; }
    .balance-box .sub { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .progress-bar { background: #334155; border-radius: 8px; height: 10px; overflow: hidden; margin-top: 12px; }
    .progress-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.3s; }

    /* רשת מדדי מאקרו חיים */
    .macro-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; text-align: center; }
    .macro-item { background: #0f172a; padding: 8px 4px; border-radius: 8px; border: 1px solid #334155; }
    .macro-item .m-title { font-size: 0.75rem; color: var(--muted); margin-bottom: 2px; }
    .macro-item .m-val { font-size: 0.95rem; font-weight: bold; }

    /* אזור ניתוח בלייב */
    .live-box { border: 2px dashed #0284c7; background: rgba(2, 132, 199, 0.05); text-align: center; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-top: 8px; font-weight: bold; }
    .status-ready { background: #1e293b; color: var(--muted); }

    /* רשימת מנות */
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; font-size: 0.85rem; }
    .item-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .delete-btn { background: none; border: none; color: var(--muted); padding: 4px 8px; font-size: 0.9rem; cursor: pointer; }
    button.action-btn { width: 100%; background: var(--accent); color: #0f172a; font-weight: bold; border: none; padding: 12px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

  <header>
    <h1>בניין והפעלת הכוח – תזונה ומאקרו בלייב</h1>
  </header>

  <!-- לוח בקרה ראשי למאקרו ויתרה -->
  <section class="card balance-box">
    <div class="sub">קלוריות שנצרכו היום (יעד: 1,850)</div>
    <div class="amount" id="cal-val">0</div>
    <div class="progress-bar">
      <div class="progress-fill" id="cal-progress"></div>
    </div>
    <div class="sub" id="cal-remaining" style="font-weight:bold; margin-top:8px;">נותרו: 1,850 קלוריות</div>

    <!-- מאקרו מצטבר בלייב -->
    <div class="macro-grid">
      <div class="macro-item">
        <div class="m-title" style="color:var(--pro);">חלבון</div>
        <div class="m-val" id="macro-pro">0g</div>
      </div>
      <div class="macro-item">
        <div class="m-title" style="color:var(--carb);">פחמימות</div>
        <div class="m-val" id="macro-carb">0g</div>
      </div>
      <div class="macro-item">
        <div class="m-title" style="color:var(--fat);">שומן</div>
        <div class="m-val" id="macro-fat">0g</div>
      </div>
      <div class="macro-item">
        <div class="m-title" style="color:var(--success);">סיבים</div>
        <div class="m-val" id="macro-fib">0g</div>
      </div>
    </div>
  </section>

  <!-- סורק לייב מובנה במכשיר -->
  <section class="card live-box">
    <h2 style="color:var(--accent);">📸 סורק מנות אוטומטי (AI Live)</h2>
    <p style="font-size:0.8rem; color:var(--muted); margin-bottom:10px;">צלם את הצלחת – הנתונים יפוענחו ויתעדכנו ישירות במדדים</p>
    
    <input type="file" id="camera-file" accept="image/*" capture="environment" style="display:none;" onchange="processLiveImage(event)">
    <button class="action-btn" onclick="document.getElementById('camera-file').click()">צלם צלחת לעדכון אוטומטי</button>
    
    <div id="live-status" class="status-badge status-ready">ממתין לצילום</div>
  </section>

  <!-- פירוט המנות שנאכלו -->
  <section class="card">
    <h2>פירוט מה שנאכל היום</h2>
    <div id="meal-list"></div>
    <button onclick="resetDay()" style="background:none; border:1px solid #334155; color:var(--muted); width:100%; margin-top:14px; padding:8px; border-radius:6px; font-size:0.8rem;">איפוס יום חדש</button>
  </section>

  <script>
    const TARGET_CAL = 1850;
    let meals = JSON.parse(localStorage.getItem('liveMeals')) || [];

    function renderUI() {
      const cal = meals.reduce((s, m) => s + m.cal, 0);
      const pro = meals.reduce((s, m) => s + m.pro, 0);
      const carb = meals.reduce((s, m) => s + m.carb, 0);
      const fat = meals.reduce((s, m) => s + m.fat, 0);
      const fib = meals.reduce((s, m) => s + m.fib, 0);

      document.getElementById('cal-val').innerText = cal;
      const rem = TARGET_CAL - cal;
      const remEl = document.getElementById('cal-remaining');
      if (rem >= 0) {
        remEl.innerText = `נותרו: ${rem} קלוריות ליעד החיטוב`;
        remEl.style.color = "var(--muted)";
      } else {
        remEl.innerText = `חריגה של ${Math.abs(rem)} קלוריות!`;
        remEl.style.color = "var(--danger)";
      }

      document.getElementById('macro-pro').innerText = Math.round(pro) + 'g';
      document.getElementById('macro-carb').innerText = Math.round(carb) + 'g';
      document.getElementById('macro-fat').innerText = Math.round(fat) + 'g';
      document.getElementById('macro-fib').innerText = Math.round(fib) + 'g';

      const pct = Math.min(100, (cal / TARGET_CAL) * 100);
      const bar = document.getElementById('cal-progress');
      bar.style.width = pct + '%';
      bar.style.background = cal > TARGET_CAL ? 'var(--danger)' : 'var(--success)';

      const list = document.getElementById('meal-list');
      list.innerHTML = meals.length ? '' : '<div style="color:var(--muted); font-size:0.8rem; text-align:center; padding:10px;">טרם נרשמו מנות היום</div>';
      
      meals.slice().reverse().forEach((m, idx) => {
        const realIdx = meals.length - 1 - idx;
        list.innerHTML += `
          <div class="item-row">
            <div>
              <strong>${m.desc}</strong>
              <div class="item-meta">חלבון: ${m.pro}ג | שומן: ${m.fat}ג | פחמימה: ${m.carb}ג | סיבים: ${m.fib}ג</div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-weight:bold; color:var(--accent);">${m.cal} קל'</span>
              <button class="delete-btn" onclick="deleteMeal(${realIdx})">✕</button>
            </div>
          </div>
        `;
      });
    }

    function addMealAuto(desc, cal, pro, fat, carb, fib) {
      meals.push({ desc, cal, pro, fat, carb, fib });
      localStorage.setItem('liveMeals', JSON.stringify(meals));
      renderUI();
    }

    function deleteMeal(idx) {
      meals.splice(idx, 1);
      localStorage.setItem('liveMeals', JSON.stringify(meals));
      renderUI();
    }

    function resetDay() {
      if (confirm('לאפס את כל נתוני היום?')) {
        meals = [];
        localStorage.removeItem('liveMeals');
        renderUI();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(window.location.search);
      if (p.has('desc') && p.has('cal')) {
        addMealAuto(
          p.get('desc'),
          parseInt(p.get('cal')),
          parseFloat(p.get('pro') || 0),
          parseFloat(p.get('fat') || 0),
          parseFloat(p.get('carb') || 0),
          parseFloat(p.get('fib') || 0)
        );
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      renderUI();
    });
  </script>
</body>
</html>
